name: Build card

on:
  push:
    branches: [main]
    paths:
      - config.yml
      - ascii.txt
      - "photo.*"
      - "card/**"
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # keep the background-removal model in one known folder so it can be cached between runs
      # (rembg's own default location differs between versions; U2NET_HOME always wins)
      U2NET_HOME: ~/.cache/rembg-models
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Did the photo change?
        id: photo
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # a manual run always redraws the portrait; a push only when this push touched the photo
          if ! ls photo.* >/dev/null 2>&1; then
            changed=false
          elif [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -q '^photo\.'; then
            changed=true
          else
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Cache background-removal model
        if: steps.photo.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/rembg-models
          key: rembg-models-v1

      - name: Photo to ASCII portrait
        if: steps.photo.outputs.changed == 'true'
        run: |
          pip install -r requirements-photo.txt
          python -m card.portrait

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build cards
        run: python -m card.build

      - name: Show the card on your profile
        # In a profile repo (username/username) whose README is still this template's docs,
        # replace it with the card, so there's nothing to paste by hand.
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$REPO" = "$OWNER/$OWNER" ] && grep -q "ascii-profile-card:template-readme" README.md; then
            base="https://raw.githubusercontent.com/$REPO/$BRANCH"
            {
              echo '<picture>'
              echo "  <source media=\"(prefers-color-scheme: dark)\" srcset=\"$base/dark_mode.svg\">"
              echo "  <source media=\"(prefers-color-scheme: light)\" srcset=\"$base/light_mode.svg\">"
              echo "  <img alt=\"$OWNER's profile card\" src=\"$base/dark_mode.svg\">"
              echo '</picture>'
              echo
              echo '<sub>Made with <a href="https://github.com/samir-created/ascii-profile-card">ascii-profile-card</a></sub>'
            } > README.md
            echo "Profile README written."
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascii.txt ./*_mode.svg README.md
          if git diff --cached --quiet; then
            echo "Cards already up to date."
          else
            git commit -m "Rebuild profile card"
            git push
          fi
