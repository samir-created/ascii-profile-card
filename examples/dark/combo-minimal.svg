<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,'SFMono-Regular',Menlo,monospace" width="1126" height="510">
<style>
.key {fill: #88c0d0;}
.value {fill: #a3be8c;}
.dots {fill: #4c566a;}
text, tspan {white-space: pre;}
.thought {opacity: 0; transform-box: fill-box; transform-origin: center; animation: think ease-out infinite;}
@keyframes think {
  0% {opacity: 0; transform: translate(0, 0) scale(0.6);}
  20% {opacity: 0.95;}
  70% {opacity: 0.6;}
  100% {opacity: 0; transform: translate(var(--drift), -75px) scale(1.1);}
}
.rain {opacity: 0.35; animation: fall linear infinite;}
@keyframes fall {from {transform: translateY(-100%);} to {transform: translateY(var(--fall));}}
.cursor {animation: blink 1s step-end infinite;}
@keyframes blink {0%, 100% {opacity: 1;} 50% {opacity: 0;}}
@media (prefers-reduced-motion: reduce) {
  .thought, .rain {display: none;}
  .cursor {animation: none;}
}
</style>
<defs><clipPath id="card"><rect width="1126" height="510" rx="15"/></clipPath></defs>
<rect width="1126" height="510" fill="#2e3440" rx="15"/>

